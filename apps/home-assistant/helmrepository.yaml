# Home Assistant publishes no official Helm chart (only container images and the
# HAOS appliance), so this is the best-maintained community chart — it tracks
# HA releases closely and supports Gateway API HTTPRoute natively.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: home-assistant
  namespace: flux-system
# OCI, not the github.io index: that URL now 301s to a plain-http custom
# domain, so the index (which picks the tarball URL + digest) was fetched
# unauthenticated. ghcr.io is HTTPS end to end.
spec:
  type: oci
  interval: 24h
  url: oci://ghcr.io/pajikos/charts
