# Dual-clamp energy meter (Zigbee 0xa4c13832d4f27d43, Tuya PJ-1203A).
# Channel A = solar: all 6 panels go through it (3 → 6 on 2026-09-19); it
# also feeds HA's built-in Energy dashboard as the solar source.
# Channel B is disabled in HA (entities + the A+B total): its clamp sits on
# the wrong cable. Once it's moved onto the main supply (between the main
# switch and the house panel), re-enable its entities, restore the B cards
# from git history, and add it as the grid source in the Energy dashboard.
#
# Entity ids are the raw IEEE address because the device is unnamed in
# Zigbee2MQTT. Renaming it there (friendly_name) regenerates these ids and
# breaks this file — rename first, then update the ids here in one pass.
title: Énergie
views:
  - title: Compteur
    path: compteur
    icon: mdi:flash
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Puissance instantanée
            heading_style: title
            icon: mdi:speedometer

          - type: tile
            entity: sensor.0xa4c13832d4f27d43_power
            name: Puissance solaire
            icon: mdi:solar-power
          - type: tile
            entity: sensor.0xa4c13832d4f27d43_energy_flow_a
            name: Sens circuit solaire
            icon: mdi:transmission-tower

      - type: grid
        cards:
          - type: heading
            heading: Historique
            heading_style: title
            icon: mdi:chart-line

          - type: history-graph
            hours_to_show: 24
            title: Puissance sur 24 h
            entities:
              - entity: sensor.0xa4c13832d4f27d43_power
                name: Puissance solaire

          # "Consommation circuit solaire" only moves when a load on the solar circuit outdraws
          # the panels (seen 15-16 and 29-30 Aug, ~2.2 kW for hours).
          - type: statistics-graph
            title: Énergie par jour (30 j)
            days_to_show: 30
            period: day
            stat_types:
              - change
            chart_type: bar
            entities:
              - entity: sensor.0xa4c13832d4f27d43_energy_3
                name: Production solaire
              - entity: sensor.0xa4c13832d4f27d43_energy
                name: Consommation circuit solaire

      - type: grid
        cards:
          - type: heading
            heading: Compteurs cumulés
            heading_style: title
            icon: mdi:counter

          - type: tile
            entity: sensor.0xa4c13832d4f27d43_energy_3
            name: Production solaire
          - type: tile
            entity: sensor.0xa4c13832d4f27d43_energy
            name: Consommation circuit solaire

      # Both entities are UI helpers living in HA storage, not in git:
      # input_number.prix_electricite and the template sensor
      # sensor.valeur_production_solaire (= production counter × price).
      - type: grid
        cards:
          - type: heading
            heading: Économies
            heading_style: title
            icon: mdi:piggy-bank

          # Upper bound: every produced kWh valued at the grid price. Only the
          # self-consumed part is a real saving (export earns nothing without a
          # resale contract); that split needs clamp B on the main supply.
          # ponytail: counter × *current* price, so a tariff change re-prices
          # all past production (one spike in the daily chart). Fine at 1-2
          # tariff changes a year; accumulate per kWh if that ever matters.
          - type: tile
            entity: sensor.valeur_production_solaire
            name: Valeur produite (max)
            icon: mdi:piggy-bank
          - type: tile
            entity: input_number.prix_electricite
            name: Prix du kWh
          - type: statistics-graph
            title: Valeur produite par jour
            days_to_show: 30
            period: day
            stat_types:
              - change
            chart_type: bar
            entities:
              - entity: sensor.valeur_production_solaire
                name: Valeur produite

      - type: grid
        cards:
          - type: heading
            heading: Réseau & diagnostic
            heading_style: title
            icon: mdi:tune

          # Voltage/frequency/power-factor matter for spotting a bad clamp or a
          # sagging supply; grouped away from the numbers you read daily.
          - type: entities
            entities:
              - entity: sensor.0xa4c13832d4f27d43_voltage
                name: Tension
              - entity: sensor.0xa4c13832d4f27d43_frequency
                name: Fréquence
              - entity: sensor.0xa4c13832d4f27d43_current
                name: Courant circuit solaire
              - entity: sensor.0xa4c13832d4f27d43_power_factor_a
                name: Facteur de puissance solaire

  # Everything else Zigbee2MQTT exposes, so the sidebar has one honest place
  # for the rest of the house without inventing structure for it yet.
  - title: Maison
    path: maison
    icon: mdi:home
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Pompe piscine
            heading_style: title
            icon: mdi:pool
          - type: tile
            entity: sensor.prise_pompe_piscine_power
            name: Puissance
          - type: tile
            entity: sensor.prise_pompe_piscine_energy
            name: Énergie
          - type: tile
            entity: sensor.prise_pompe_piscine_voltage
            name: Tension
          - type: tile
            entity: sensor.prise_pompe_piscine_current
            name: Courant
      - type: grid
        cards:
          - type: heading
            heading: Cuisine
            heading_style: title
            icon: mdi:thermometer
          - type: tile
            entity: light.philips_hue_led_e14
            name: Hue E14
          - type: tile
            entity: binary_sensor.zigbee2mqtt_bridge_connection_state
            name: Bridge Zigbee2MQTT
