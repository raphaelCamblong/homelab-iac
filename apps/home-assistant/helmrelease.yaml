apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: home-assistant
      version: "0.3.74"
      sourceRef:
        kind: HelmRepository
        name: home-assistant
        namespace: flux-system
  install:
    timeout: 15m
    remediation: { retries: 3 }
  upgrade:
    timeout: 15m
    remediation: { retries: 3 }
  valuesFrom:
    - kind: ConfigMap
      name: home-assistant-values
      valuesKey: values.yaml
