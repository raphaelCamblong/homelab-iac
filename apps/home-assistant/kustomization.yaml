apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - edge-backends/zigbee2mqtt.yaml
  - edge-backends/mosquitto.yaml
configMapGenerator:
  - name: home-assistant-values
    namespace: home-assistant
    files:
      - values.yaml
  # Mounted at /config/dashboards. substitute: disabled — dashboard YAML can
  # carry Jinja/JS templating that Flux's envsubst must not touch.
  - name: home-assistant-dashboards
    namespace: home-assistant
    files:
      - dashboards/power.yaml
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true
