apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - edge-backends/zigbee2mqtt.yaml
  - edge-backends/mosquitto.yaml
configMapGenerator:
  - name: home-assistant-values
    namespace: home-assistant
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
