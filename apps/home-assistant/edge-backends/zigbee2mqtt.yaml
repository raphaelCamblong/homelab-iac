# Zigbee2MQTT runs on the edge Pi (the Zigbee dongle is physically plugged into
# it), so it can't be a normal in-cluster workload. Same trick as the NAS
# backends: a selector-less Service + hand-written EndpointSlice pointing at the
# host, so the Gateway can front it with the real wildcard cert and Hubble
# observes the flow.
apiVersion: v1
kind: Service
metadata:
  name: zigbee2mqtt-edge
  namespace: home-assistant
spec:
  type: ClusterIP
  ports:
    - { name: http, port: 8080, targetPort: 8080, protocol: TCP }
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: zigbee2mqtt-edge-1
  namespace: home-assistant
  labels:
    kubernetes.io/service-name: zigbee2mqtt-edge
addressType: IPv4
ports:
  - { name: http, port: 8080, protocol: TCP }
endpoints:
  - addresses: ["${EDGE_HOST}"]
    conditions: { ready: true }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zigbee2mqtt
  namespace: home-assistant
spec:
  parentRefs:
    - kind: Gateway
      name: cilium
      namespace: gateway
      sectionName: https
  hostnames:
    - "zigbee.${DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: zigbee2mqtt-edge
          port: 8080
