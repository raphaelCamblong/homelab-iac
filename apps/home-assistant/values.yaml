env:
  - name: TZ
    value: Europe/Paris

# /config holds the whole HA state: config, the SQLite recorder DB, and the
# secrets HA generates at onboarding. Losing it means re-onboarding from zero.
persistence:
  enabled: true
  size: 10Gi
  storageClass: longhorn
  accessMode: ReadWriteOnce

# Seeds configuration.yaml on first boot. The http block is the part that
# matters: behind the Gateway, HA rejects every proxied request with
# "400 Bad Request" unless it trusts the proxy's source range.
# forceInit stays false so hand edits in the UI are never overwritten.
configuration:
  enabled: true
  forceInit: false
  trusted_proxies:
    - 10.42.0.0/16   # pod CIDR — the Gateway (cilium-envoy) fronts HA from here
    - 10.43.0.0/16   # service CIDR
  # Overrides the chart default only to append the `lovelace:` block, which
  # registers the git-managed YAML dashboard mounted at /config/dashboards.
  # Keep the rest identical to the chart's template, or a fresh install loses
  # default_config / themes / the automation includes.
  templateConfig: |-
    # Loads default set of integrations. Do not remove.
    default_config:

    {{- if .Values.serviceMonitor.enabled }}
    prometheus:
    {{- end }}

    {{- if or .Values.ingress.enabled .Values.ingress.external .Values.httpRoute.enabled }}
    http:
      use_x_forwarded_for: true
      trusted_proxies:
        {{- range .Values.configuration.trusted_proxies }}
        - {{ . }}
        {{- end }}
    {{- end}}
    # Load frontend themes from the themes folder
    frontend:
      themes: !include_dir_merge_named themes

    # UI-created dashboards keep working (mode: storage); the YAML one below is
    # read-only in the UI and versioned in git instead.
    lovelace:
      mode: storage
      dashboards:
        energie-yaml:
          mode: yaml
          title: Énergie
          icon: mdi:flash
          show_in_sidebar: true
          filename: dashboards/power.yaml

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

# The dashboard file itself, mounted read-only from a ConfigMap so it stays
# git-managed rather than living only in the PVC.
additionalVolumes:
  - name: dashboards
    configMap:
      name: home-assistant-dashboards
additionalMounts:
  - name: dashboards
    mountPath: /config/dashboards
    readOnly: true

# Chart-native Gateway API route; no hand-written HTTPRoute needed.
httpRoute:
  enabled: true
  parentRefs:
    - name: cilium
      namespace: gateway
      sectionName: https
  hostnames:
    - "ha.${DOMAIN}"

service:
  type: ClusterIP
  port: 8123

# ponytail: hostNetwork stays OFF. It's only needed for mDNS/SSDP auto-discovery
# of LAN devices (Sonos, Chromecast, HomeKit). Zigbee arrives over MQTT, which
# doesn't care. Turn it on only if you add an integration that truly needs LAN
# broadcast — it costs the pod its own netns and complicates the HTTPRoute.
hostNetwork: false

resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits:   { cpu: 2, memory: 2Gi }

# HA is slow to start on a Pi (first boot builds the DB and pulls integrations),
# so give it up to 5 minutes before the liveness probe starts killing it.
# The chart passes this block through verbatim — it needs a real handler, not
# just timings, or the StatefulSet is rejected outright.
startupProbe:
  httpGet:
    path: /
    port: http
    scheme: HTTP
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 30
