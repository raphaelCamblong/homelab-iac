apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-vars
  namespace: flux-system
data:
  DOMAIN: lab.raphlamenace.xyz
  K8S_API_HOST: 192.168.1.41
  GATEWAY_VIP: 192.168.1.200
  # WireGuard: LB IP is what the router port-forwards UDP 51820 to; WG_HOST is
  # what peers dial. Deliberately a DNS name, never a literal public IP: the
  # ISP rotates it (already did once), and this repo is public. The record is
  # A / DNS-only / TTL 60 — WireGuard is UDP, so it cannot be Cloudflare-proxied.
  WG_LB_IP: 192.168.1.201
  WG_HOST: vpn.raphlamenace.xyz
