apiVersion: v1
kind: Namespace
metadata:
  name: wireguard
  # privileged: the VPN server needs NET_ADMIN to manage the wg0 interface, and
  # an initContainer runs privileged to set net.ipv4.ip_forward in the pod netns
  # (kubelet classes that sysctl as unsafe, so it can't be set declaratively
  # without an --allowed-unsafe-sysctls flag on every node).
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
