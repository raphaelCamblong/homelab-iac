# The VPN socket itself: a LAN IP from the Cilium LB pool (${WG_LB_IP}),
# L2-announced on eth0 — use that from inside the LAN.
#
# The router forwards public UDP 51820 straight to this VIP, so the pod is free
# to run on either node — Cilium announces the VIP from wherever it lands.
# (An earlier revision pinned a nodePort + hostPort because the Livebox appeared
# to only accept devices from its DHCP list; it accepts a raw IP, so that
# scaffolding is gone.)
apiVersion: v1
kind: Service
metadata:
  name: wireguard
  namespace: wireguard
  annotations:
    io.cilium/lb-ipam-ips: "${WG_LB_IP}"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector: { app.kubernetes.io/name: wireguard }
  ports:
    - name: wireguard
      port: 51820
      targetPort: wireguard
      protocol: UDP
---
# Web UI, reached through the Gateway (LAN-only, like every other lab.* host)
# rather than published on the LoadBalancer.
apiVersion: v1
kind: Service
metadata:
  name: wireguard-ui
  namespace: wireguard
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: wireguard }
  ports:
    - name: http
      port: 51821
      targetPort: http
      protocol: TCP
