apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
  namespace: wireguard
  labels: { app.kubernetes.io/name: wireguard }
spec:
  # One replica: a VPN endpoint is single-homed by definition (peers dial one
  # UDP socket) and the config PVC is RWO. Recreate, never two at once.
  replicas: 1
  revisionHistoryLimit: 2
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: wireguard }
  template:
    metadata:
      labels: { app.kubernetes.io/name: wireguard }
    spec:
      initContainers:
        # ip_forward/src_valid_mark are unsafe sysctls to kubelet, so they can't
        # go in pod securityContext without a node flag. Setting them here
        # applies to the shared pod netns for the main container. Same image =
        # no extra pull.
        - name: sysctl
          image: ghcr.io/wg-easy/wg-easy:15.3.0
          command: ["/bin/sh", "-c"]
          args:
            - sysctl -w net.ipv4.ip_forward=1 && sysctl -w net.ipv4.conf.all.src_valid_mark=1
          securityContext:
            privileged: true
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 32Mi }
      containers:
        - name: wg-easy
          image: ghcr.io/wg-easy/wg-easy:15.3.0
          imagePullPolicy: IfNotPresent
          env:
            # INIT_* apply on FIRST START ONLY — afterwards the config lives in
            # the PVC and is edited through the UI. Changing these later is a
            # no-op; wipe the PVC to re-bootstrap.
            - name: INIT_ENABLED
              value: "true"
            - name: INIT_USERNAME
              value: admin
            - name: INIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wireguard-admin
                  key: password
            # What peers dial: public IP (or DNS name) + the router-forwarded port.
            - name: INIT_HOST
              value: "${WG_HOST}"
            - name: INIT_PORT
              value: "51820"
            - name: INIT_DNS
              value: "192.168.1.1,1.1.1.1"
            # 10.8.0.0/24, NOT the LAN range — clients must not be numbered in
            # the same subnet they're dialing in to reach.
            - name: INIT_IPV4_CIDR
              value: "10.8.0.0/24"
            - name: INIT_IPV6_CIDR
              value: "fdcc:ad94:bacf:61a3::/64"
            # Full tunnel by default; override per-client in the UI for split.
            - name: INIT_ALLOWED_IPS
              value: "0.0.0.0/0,::/0"
            # v4-only LAN: skip the IPv6 firewall rules.
            - name: DISABLE_IPV6
              value: "true"
            # The Gateway terminates TLS and speaks plain HTTP to this backend.
            - name: INSECURE
              value: "true"
          ports:
            - { name: wireguard, containerPort: 51820, protocol: UDP }
            - { name: http, containerPort: 51821, protocol: TCP }
          volumeMounts:
            - name: config
              mountPath: /etc/wireguard
          securityContext:
            capabilities:
              # No SYS_MODULE: the wireguard module is already loaded on both
              # nodes, so the pod never needs to insmod it.
              add: [NET_ADMIN]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 1, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: wireguard-config
